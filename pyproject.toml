[project]
name = "machine-learning-operations"
version = "0.1.0"
description = "For the machine learning operation web application"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "dvc (>=3.67.1,<4.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "pycaret[models] (>=3.3.2,<4.0.0)",
    "pip (>=26.2.1,<27.0.0)",
    "hydra-core (>=1.3.5,<2.0.0)",
    "streamlit (>=1.62.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "mlflow (==2.17.2)",
    "scikit-learn (>=1.4,<1.5)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false