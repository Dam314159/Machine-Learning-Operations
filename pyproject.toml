[project]
name = "machine-learning-operations"
version = "0.1.0"
description = "For machine learning operations web app"
authors = [
    {name = "Damien"},
    {name = "Xiao Yao"}
]
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pycaret (>=3.3.2,<4.0.0)",
    "streamlit (>=1.61.1,<2.0.0)",
    "mlflow (>=3.15.1,<4.0.0)",
    "hydra-core (>=1.3.5,<2.0.0)",
    "dvc[gdrive] (>=3.67.1,<4.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "notebook (>=7.6.2,<8.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "pyopenssl (>=26.4.0,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false